<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Студенты — Учёт студентов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <div>
            <h1>Список студентов</h1>
            <p class="muted" th:text="'Вы вошли как ' + ${username}"></p>
        </div>
        <div class="header-actions">
            <a class="button" th:href="@{/students/add}">Добавить студента</a>
            <a class="button button-secondary" th:href="@{/logout}">Выйти</a>
        </div>
    </header>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя студента</th>
                <th>Курс</th>
                <th>Есть задолженность</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.course}"></td>
                <td th:text="${student.hasDebt} ? 'Да' : 'Нет'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}">
                <td class="empty" colspan="4">Студентов пока нет. Добавьте первую запись.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="result-count" th:text="'Всего студентов: ' + ${#lists.size(students)}"></p>
</main>
</body>
</html>
